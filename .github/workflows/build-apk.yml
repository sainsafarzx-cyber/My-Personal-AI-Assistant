name: Build LEON AI APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Universal Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 36 & 36.1)
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Verify Android 36.1 SDK & licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || command -v sdkmanager || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-36.1" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
            fi
          fi
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
          test -d "$SDK_ROOT/platforms/android-36.1"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Prepare environment and debug signing keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Build universal installable APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --console=plain \
            --max-workers=2 \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            2>&1 | tee build-debug.log; then
            echo ""
            echo "================ EXACT BUILD ERROR SUMMARY ================"
            grep -nE "(^> Task .* FAILED|^e: |^\* What went wrong:|Caused by:|Execution failed for task|OutOfMemoryError|Duplicate class)" build-debug.log | head -n 45 || true
            echo "==========================================================="
            exit 1
          fi

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build-debug.log
          if-no-files-found: ignore

      - name: Package APK for download
        run: |
          mkdir -p dist
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/LEON-AI-universal.apk
          ls -lh dist/LEON-AI-universal.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEON-AI-universal-apk
          path: dist/LEON-AI-universal.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: LEON AI — Latest Universal Android APK
          body: |
            Universal installable Android APK for **LEON AI** (Android 7.0+ / API 24–36, ARM64 + ARMv7 + x86).

            ### Install on any Android phone:
            1. Tap **LEON-AI-universal.apk** below to download.
            2. Open the downloaded `.apk` file.
            3. Allow **Install unknown apps** if prompted, then tap **Install**.
          files: dist/LEON-AI-universal.apk
